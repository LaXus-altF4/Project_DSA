<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="fav-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="fav-top" x1="16" y1="14" x2="48" y2="33" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="fav-left" x1="15" y1="24" x2="32" y2="51" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="fav-right" x1="32" y1="24" x2="49" y2="51" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <filter id="fav-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Nền badge bo tròn tương phản cao trên cả tab sáng và tối -->
  <rect width="64" height="64" rx="15" fill="url(#fav-bg)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="14.25" stroke="#3B82F6" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- Khối lập phương vi mạch phối cảnh 3D (Isometric Cube) -->
  <!-- Mặt đỉnh (Top Face) -->
  <polygon points="32,13 50,23.5 32,34 14,23.5" fill="url(#fav-top)"/>

  <!-- Mặt trái (Left Face) -->
  <polygon points="14,23.5 32,34 32,51 14,40.5" fill="url(#fav-left)"/>

  <!-- Mặt phải (Right Face) -->
  <polygon points="32,34 50,23.5 50,40.5 32,51" fill="url(#fav-right)"/>

  <!-- Viền sáng đỉnh phân tách cạnh -->
  <polyline points="14,23.5 32,34 50,23.5" stroke="#93C5FD" stroke-width="1.2" stroke-linejoin="round" opacity="0.9"/>
  <line x1="32" y1="34" x2="32" y2="51" stroke="#93C5FD" stroke-width="1.2" opacity="0.75"/>

  <!-- Đường mạch Lab tông lục bảo & cyan -->
  <path d="M22 18.8 L32 24.5 L42 18.8" stroke="#A7F3D0" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
  <circle cx="32" cy="24.5" r="3" fill="#10B981" stroke="#ECFDF5" stroke-width="1" filter="url(#fav-glow)"/>

  <!-- Các chân pin kim loại viền bên -->
  <circle cx="21" cy="33.5" r="1.2" fill="#FDE047" opacity="0.85"/>
  <circle cx="25.5" cy="36" r="1.2" fill="#FDE047" opacity="0.85"/>
  <circle cx="38.5" cy="36" r="1.2" fill="#FDE047" opacity="0.85"/>
  <circle cx="43" cy="33.5" r="1.2" fill="#FDE047" opacity="0.85"/>

  <!-- Chấm tín hiệu góc -->
  <circle cx="32" cy="16.5" r="1.2" fill="#6EE7B7"/>
</svg>
