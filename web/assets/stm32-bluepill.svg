<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 164" width="360" height="164" role="img" aria-label="Board phát triển STM32F103 Blue Pill">
  <defs>
    <linearGradient id="pcbBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12507A"/>
      <stop offset="55%" stop-color="#10466D"/>
      <stop offset="100%" stop-color="#0E3A5C"/>
    </linearGradient>
    <linearGradient id="metalSilver" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="50%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="chipDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27303F"/>
      <stop offset="100%" stop-color="#111620"/>
    </linearGradient>
    <radialGradient id="ledRedGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FCA5A5" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#EF4444" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ledGreenGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A7F3D0" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#10B981" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Bóng đổ mềm bên dưới board -->
  <ellipse cx="180" cy="144" rx="154" ry="15" fill="#020617" fill-opacity="0.26"/>
  <rect x="24" y="24" width="316" height="122" rx="12" fill="#020617" fill-opacity="0.20"/>

  <!-- Thân PCB Blue Pill tông xanh lam đậm ngả teal & viền sáng cyan mảnh -->
  <rect x="20" y="18" width="316" height="122" rx="11" fill="url(#pcbBlue)" stroke="#22D3EE" stroke-width="1.4"/>
  <rect x="24" y="22" width="308" height="114" rx="8" fill="none" stroke="#67E8F9" stroke-opacity="0.34" stroke-width="0.9"/>

  <!-- Đường mạch đồng mảnh trên mặt PCB từ chip LQFP48 ra 2 hàng header -->
  <g stroke="#22D3EE" stroke-opacity="0.46" stroke-width="1.25" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="164,62 150,48 112,48 112,33"/>
    <polyline points="172,58 164,44 142,44 142,33"/>
    <polyline points="180,58 180,33"/>
    <polyline points="188,58 196,44 217,44 217,33"/>
    <polyline points="196,62 212,48 247,48 247,33"/>
    <polyline points="164,96 148,110 112,110 112,125"/>
    <polyline points="172,100 164,114 142,114 142,125"/>
    <polyline points="180,100 180,125"/>
    <polyline points="188,100 196,114 217,114 217,125"/>
    <polyline points="196,96 212,110 262,110 262,125"/>
    <polyline points="156,79 124,79 112,70"/>
    <polyline points="204,79 236,79"/>
  </g>

  <!-- Cổng Micro-USB bằng thép ở đầu trái -->
  <rect x="11" y="59" width="28" height="40" rx="3" fill="url(#metalSilver)" stroke="#64748B" stroke-width="1"/>
  <rect x="15" y="66" width="8" height="10" rx="1" fill="#475569"/>
  <rect x="15" y="82" width="8" height="10" rx="1" fill="#475569"/>
  <line x1="11" y1="65" x2="11" y2="93" stroke="#1E293B" stroke-width="2.2"/>

  <!-- IC ổn áp nguồn LDO 3.3V nhỏ cạnh cổng USB -->
  <rect x="52" y="70" width="16" height="20" rx="1.5" fill="#1E293B" stroke="#475569" stroke-width="0.7"/>
  <rect x="48" y="73" width="4" height="3" fill="#CBD5E1"/>
  <rect x="48" y="78.5" width="4" height="3" fill="#CBD5E1"/>
  <rect x="48" y="84" width="4" height="3" fill="#CBD5E1"/>
  <rect x="68" y="76" width="5" height="8" fill="#CBD5E1"/>

  <!-- Nút nhấn Reset (góc dưới bên trái) -->
  <g transform="translate(76, 94)">
    <rect x="0" y="0" width="20" height="20" rx="2.5" fill="url(#metalSilver)" stroke="#64748B" stroke-width="0.9"/>
    <circle cx="3.5" cy="3.5" r="1.4" fill="#334155"/>
    <circle cx="16.5" cy="3.5" r="1.4" fill="#334155"/>
    <circle cx="3.5" cy="16.5" r="1.4" fill="#334155"/>
    <circle cx="16.5" cy="16.5" r="1.4" fill="#334155"/>
    <circle cx="10" cy="10" r="5.5" fill="#F8FAFC" stroke="#475569" stroke-width="1"/>
    <text x="10" y="-3" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="6.5" font-weight="700" fill="#DBEAFE">RST</text>
  </g>

  <!-- Tinh thể thạch anh 8MHz vỏ kim loại bầu dục -->
  <g transform="translate(104, 56)">
    <rect x="0" y="0" width="28" height="14" rx="7" fill="url(#metalSilver)" stroke="#64748B" stroke-width="1"/>
    <rect x="3" y="2.5" width="22" height="9" rx="4.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.65" stroke-width="0.8"/>
    <text x="14" y="9" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="6" font-weight="700" fill="#334155">8.000</text>
  </g>

  <!-- LED PC13 (xanh lá) góc trên trái -->
  <circle cx="84" cy="52" r="9" fill="url(#ledGreenGlow)"/>
  <rect x="80" y="49" width="8" height="6" rx="1.2" fill="#ECFDF5" stroke="#10B981" stroke-width="1"/>
  <circle cx="84" cy="52" r="2.1" fill="#10B981"/>
  <text x="84" y="44" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="6.2" font-weight="700" fill="#A7F3D0">PC13</text>

  <!-- Chip trung tâm LQFP48 đen xoay 45 độ (CHỈ ghi STM32F103, không logo thương hiệu) -->
  <g transform="translate(180, 79) rotate(-45)">
    <!-- 48 chân kim loại 4 cạnh (12 chân mỗi cạnh) -->
    <g fill="#E2E8F0">
      <!-- Cạnh trên & dưới -->
      <rect x="-21" y="-31" width="2.2" height="5.5"/><rect x="-17.2" y="-31" width="2.2" height="5.5"/>
      <rect x="-13.4" y="-31" width="2.2" height="5.5"/><rect x="-9.6" y="-31" width="2.2" height="5.5"/>
      <rect x="-5.8" y="-31" width="2.2" height="5.5"/><rect x="-2.0" y="-31" width="2.2" height="5.5"/>
      <rect x="1.8" y="-31" width="2.2" height="5.5"/><rect x="5.6" y="-31" width="2.2" height="5.5"/>
      <rect x="9.4" y="-31" width="2.2" height="5.5"/><rect x="13.2" y="-31" width="2.2" height="5.5"/>
      <rect x="17.0" y="-31" width="2.2" height="5.5"/><rect x="20.8" y="-31" width="2.2" height="5.5"/>

      <rect x="-21" y="25.5" width="2.2" height="5.5"/><rect x="-17.2" y="25.5" width="2.2" height="5.5"/>
      <rect x="-13.4" y="25.5" width="2.2" height="5.5"/><rect x="-9.6" y="25.5" width="2.2" height="5.5"/>
      <rect x="-5.8" y="25.5" width="2.2" height="5.5"/><rect x="-2.0" y="25.5" width="2.2" height="5.5"/>
      <rect x="1.8" y="25.5" width="2.2" height="5.5"/><rect x="5.6" y="25.5" width="2.2" height="5.5"/>
      <rect x="9.4" y="25.5" width="2.2" height="5.5"/><rect x="13.2" y="25.5" width="2.2" height="5.5"/>
      <rect x="17.0" y="25.5" width="2.2" height="5.5"/><rect x="20.8" y="25.5" width="2.2" height="5.5"/>

      <!-- Cạnh trái & phải -->
      <rect x="-31" y="-21" width="5.5" height="2.2"/><rect x="-31" y="-17.2" width="5.5" height="2.2"/>
      <rect x="-31" y="-13.4" width="5.5" height="2.2"/><rect x="-31" y="-9.6" width="5.5" height="2.2"/>
      <rect x="-31" y="-5.8" width="5.5" height="2.2"/><rect x="-31" y="-2.0" width="5.5" height="2.2"/>
      <rect x="-31" y="1.8" width="5.5" height="2.2"/><rect x="-31" y="5.6" width="5.5" height="2.2"/>
      <rect x="-31" y="9.4" width="5.5" height="2.2"/><rect x="-31" y="13.2" width="5.5" height="2.2"/>
      <rect x="-31" y="17.0" width="5.5" height="2.2"/><rect x="-31" y="20.8" width="5.5" height="2.2"/>

      <rect x="25.5" y="-21" width="5.5" height="2.2"/><rect x="25.5" y="-17.2" width="5.5" height="2.2"/>
      <rect x="25.5" y="-13.4" width="5.5" height="2.2"/><rect x="25.5" y="-9.6" width="5.5" height="2.2"/>
      <rect x="25.5" y="-5.8" width="5.5" height="2.2"/><rect x="25.5" y="-2.0" width="5.5" height="2.2"/>
      <rect x="25.5" y="1.8" width="5.5" height="2.2"/><rect x="25.5" y="5.6" width="5.5" height="2.2"/>
      <rect x="25.5" y="9.4" width="5.5" height="2.2"/><rect x="25.5" y="13.2" width="5.5" height="2.2"/>
      <rect x="25.5" y="17.0" width="5.5" height="2.2"/><rect x="25.5" y="20.8" width="5.5" height="2.2"/>
    </g>

    <!-- Thân gốm đen LQFP48 -->
    <rect x="-25.5" y="-25.5" width="51" height="51" rx="3" fill="url(#chipDark)" stroke="#475569" stroke-width="1"/>
    <rect x="-22" y="-22" width="44" height="44" rx="2" fill="none" stroke="#64748B" stroke-opacity="0.35" stroke-width="0.7"/>
    <circle cx="-17.5" cy="-17.5" r="2.1" fill="#94A3B8" fill-opacity="0.65"/>
    <text x="0" y="3" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="7.4" font-weight="700" fill="#F1F5F9" letter-spacing="0.2">STM32F103</text>
  </g>

  <!-- 2 Jumper vàng BOOT0 & BOOT1 -->
  <g transform="translate(234, 58)">
    <!-- BOOT0 -->
    <rect x="0" y="0" width="32" height="11" rx="2" fill="#1E293B"/>
    <rect x="2" y="1.5" width="20" height="8" rx="1.5" fill="#FACC15" stroke="#CA8A04" stroke-width="0.8"/>
    <circle cx="7" cy="5.5" r="1.6" fill="#B45309"/>
    <circle cx="17" cy="5.5" r="1.6" fill="#B45309"/>
    <circle cx="27" cy="5.5" r="1.8" fill="#FBBF24"/>
    <text x="16" y="-3" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="6" font-weight="700" fill="#DBEAFE">BOOT0</text>

    <!-- BOOT1 -->
    <rect x="0" y="24" width="32" height="11" rx="2" fill="#1E293B"/>
    <rect x="2" y="25.5" width="20" height="8" rx="1.5" fill="#FACC15" stroke="#CA8A04" stroke-width="0.8"/>
    <circle cx="7" cy="29.5" r="1.6" fill="#B45309"/>
    <circle cx="17" cy="29.5" r="1.6" fill="#B45309"/>
    <circle cx="27" cy="29.5" r="1.8" fill="#FBBF24"/>
    <text x="16" y="43" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="6" font-weight="700" fill="#DBEAFE">BOOT1</text>
  </g>

  <!-- LED Nguồn đỏ (PWR) sáng liên tục -->
  <circle cx="290" cy="56" r="10" fill="url(#ledRedGlow)"/>
  <rect x="286" y="53" width="8" height="6" rx="1.2" fill="#FEF2F2" stroke="#EF4444" stroke-width="1"/>
  <circle cx="290" cy="56" r="2.2" fill="#EF4444"/>
  <text x="290" y="47" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="6.2" font-weight="700" fill="#FECACA">PWR</text>

  <!-- Header nạp SWD 4 chân ở cạnh phải -->
  <rect x="316" y="56" width="10" height="46" rx="2" fill="#1E293B"/>
  <g fill="#FBBF24" stroke="#B45309" stroke-width="0.6">
    <rect x="319" y="60" width="14" height="3.2" rx="1"/>
    <rect x="319" y="71" width="14" height="3.2" rx="1"/>
    <rect x="319" y="82" width="14" height="3.2" rx="1"/>
    <rect x="319" y="93" width="14" height="3.2" rx="1"/>
  </g>

  <!-- 2 hàng 20 chân Header vàng dọc hai cạnh dài (trên & dưới) -->
  <rect x="33" y="24" width="286" height="10" rx="2" fill="#0F172A" fill-opacity="0.72"/>
  <rect x="33" y="124" width="286" height="10" rx="2" fill="#0F172A" fill-opacity="0.72"/>
  <g fill="#FBBF24" stroke="#B45309" stroke-width="0.65">
    <!-- Hàng trên (20 chân vàng) -->
    <circle cx="40" cy="29" r="3"/><circle cx="54.5" cy="29" r="3"/><circle cx="69" cy="29" r="3"/><circle cx="83.5" cy="29" r="3"/>
    <circle cx="98" cy="29" r="3"/><circle cx="112.5" cy="29" r="3"/><circle cx="127" cy="29" r="3"/><circle cx="141.5" cy="29" r="3"/>
    <circle cx="156" cy="29" r="3"/><circle cx="170.5" cy="29" r="3"/><circle cx="185" cy="29" r="3"/><circle cx="199.5" cy="29" r="3"/>
    <circle cx="214" cy="29" r="3"/><circle cx="228.5" cy="29" r="3"/><circle cx="243" cy="29" r="3"/><circle cx="257.5" cy="29" r="3"/>
    <circle cx="272" cy="29" r="3"/><circle cx="286.5" cy="29" r="3"/><circle cx="301" cy="29" r="3"/><circle cx="315.5" cy="29" r="3"/>
    <!-- Hàng dưới (20 chân vàng) -->
    <circle cx="40" cy="129" r="3"/><circle cx="54.5" cy="129" r="3"/><circle cx="69" cy="129" r="3"/><circle cx="83.5" cy="129" r="3"/>
    <circle cx="98" cy="129" r="3"/><circle cx="112.5" cy="129" r="3"/><circle cx="127" cy="129" r="3"/><circle cx="141.5" cy="129" r="3"/>
    <circle cx="156" cy="129" r="3"/><circle cx="170.5" cy="129" r="3"/><circle cx="185" cy="129" r="3"/><circle cx="199.5" cy="129" r="3"/>
    <circle cx="214" cy="129" r="3"/><circle cx="228.5" cy="129" r="3"/><circle cx="243" cy="129" r="3"/><circle cx="257.5" cy="129" r="3"/>
    <circle cx="272" cy="129" r="3"/><circle cx="286.5" cy="129" r="3"/><circle cx="301" cy="129" r="3"/><circle cx="315.5" cy="129" r="3"/>
  </g>
</svg>
