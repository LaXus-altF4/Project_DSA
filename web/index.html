<!DOCTYPE html>
<html lang="vi" data-theme="light" data-fx="3d">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab Manager — Quản lý mượn trả thiết bị phòng Lab</title>

  <!-- Favicon vector cục bộ (100% Offline) -->
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">

  <!-- Đồng bộ sớm Theme & Công tắc 3D trước khung hình đầu tiên (tránh nháy sáng/hiệu ứng) -->
  <script>
    try {
      var params = new URLSearchParams(window.location.search);
      var urlFx = params.get('fx');
      var savedFx = localStorage.getItem('lab_fx_3d');
      if (urlFx === 'off' || urlFx === '0' || urlFx === 'flat' || (!urlFx && savedFx === 'off')) {
        document.documentElement.setAttribute('data-fx', 'flat');
      }
      var urlTheme = params.get('theme');
      var savedTheme = localStorage.getItem('lab_theme');
      var theme = (urlTheme === 'dark' || urlTheme === 'light')
        ? urlTheme
        : (savedTheme === 'dark' || savedTheme === 'light')
          ? savedTheme
          : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    } catch (_) {}
  </script>

  <!-- CSS hệ thống (100% Cục bộ) -->
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/effects-3d.css">

  <!-- Thư viện Vendor cục bộ (100% Offline) -->
  <script src="vendor/lucide.min.js"></script>
  <script src="vendor/vis-network.min.js"></script>
</head>
<body>
  <!-- Lớp nền Dark-tech: Lưới mảnh + 3 quầng radial + Đường mạch cyan + Three.js -->
  <div id="ambient-bg-root" aria-hidden="true">
    <div class="bg-tech-grid"></div>
    <div class="bg-gradient-mesh">
      <div class="mesh-orb mesh-orb-1"></div>
      <div class="mesh-orb mesh-orb-2"></div>
      <div class="mesh-orb mesh-orb-3"></div>
    </div>
    <svg class="bg-circuit-traces" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
      <!-- Nhánh mạch góc trên phải -->
      <path class="circuit-path" d="M 1040 0 L 1040 72 L 1112 144 L 1300 144 L 1356 88 L 1440 88"/>
      <path class="circuit-path" d="M 1180 0 L 1180 56 L 1228 104 L 1440 104"/>
      <circle class="circuit-via" cx="1112" cy="144" r="3.5"/>
      <circle class="circuit-via" cx="1300" cy="144" r="3.5"/>
      <circle class="circuit-via" cx="1228" cy="104" r="3"/>
      <!-- Nhánh mạch góc dưới trái (ngoài vùng sidebar) -->
      <path class="circuit-path" d="M 272 780 L 348 780 L 396 828 L 396 900"/>
      <path class="circuit-path" d="M 272 820 L 320 820 L 352 852 L 520 852"/>
      <circle class="circuit-via" cx="348" cy="780" r="3.5"/>
      <circle class="circuit-via" cx="352" cy="852" r="3"/>
      <!-- Nhánh mạch góc dưới phải -->
      <path class="circuit-path" d="M 1180 900 L 1180 820 L 1252 748 L 1440 748"/>
      <path class="circuit-path" d="M 1290 900 L 1290 832 L 1344 778 L 1440 778"/>
      <circle class="circuit-via" cx="1180" cy="820" r="3.5"/>
      <circle class="circuit-via" cx="1252" cy="748" r="3.5"/>
      <circle class="circuit-via" cx="1344" cy="778" r="3"/>
    </svg>
    <canvas id="bg-3d-canvas"></canvas>
  </div>

  <div id="app">
    <!-- Sidebar điều hướng bên trái -->
    <aside id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo-icon" aria-hidden="true" title="Lab Manager — HCMUS">
          <svg class="sidebar-logo-svg" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="32" height="32" rx="8" fill="url(#logo-bg-grad)"/>
            <!-- Mạch vi xử lý đa lớp -->
            <path d="M7 16H10M22 16H25M16 7V10M16 22V25" stroke="#93C5FD" stroke-width="1.5" stroke-linecap="round" opacity="0.85"/>
            <rect x="10.5" y="10.5" width="11" height="11" rx="2.5" fill="#1E3A8A" stroke="#60A5FA" stroke-width="1.2"/>
            <!-- Lõi chip trung tâm tông lục bảo -->
            <rect x="13" y="13" width="6" height="6" rx="1.5" fill="#10B981" class="logo-chip-core"/>
            <!-- Các chân góc -->
            <circle cx="8" cy="8" r="1" fill="#60A5FA" opacity="0.6"/>
            <circle cx="24" cy="8" r="1" fill="#60A5FA" opacity="0.6"/>
            <circle cx="8" cy="24" r="1" fill="#60A5FA" opacity="0.6"/>
            <circle cx="24" cy="24" r="1" fill="#60A5FA" opacity="0.6"/>
            <defs>
              <linearGradient id="logo-bg-grad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#3B82F6"/>
                <stop offset="100%" stop-color="#1D4ED8"/>
              </linearGradient>
            </defs>
          </svg>
          <span class="sidebar-logo-sheen"></span>
        </div>
        <div>
          <div class="sidebar-title">Lab Manager</div>
          <div class="sidebar-subtitle">HCMUS • Đồ án CTDL &amp; GT</div>
        </div>
      </div>

      <nav class="sidebar-nav" aria-label="Điều hướng chính">
        <a href="#/dashboard" class="nav-item">
          <i data-lucide="layout-dashboard" width="18" height="18" aria-hidden="true"></i>
          <span>Tổng quan</span>
        </a>
        <a href="#/devices" class="nav-item">
          <i data-lucide="layers" width="18" height="18" aria-hidden="true"></i>
          <span>Thiết bị</span>
        </a>
        <a href="#/borrow" class="nav-item">
          <i data-lucide="file-plus-2" width="18" height="18" aria-hidden="true"></i>
          <span>Mượn thiết bị</span>
        </a>
        <a href="#/return" class="nav-item">
          <i data-lucide="rotate-ccw" width="18" height="18" aria-hidden="true"></i>
          <span>Trả thiết bị</span>
        </a>
        <a href="#/reservations" class="nav-item">
          <i data-lucide="clock-4" width="18" height="18" aria-hidden="true"></i>
          <span>Hàng đợi đặt trước</span>
        </a>
        <a href="#/records" class="nav-item">
          <i data-lucide="clipboard-list" width="18" height="18" aria-hidden="true"></i>
          <span>Quá hạn &amp; Lịch sử</span>
        </a>
        <a href="#/graph" class="nav-item">
          <i data-lucide="network" width="18" height="18" aria-hidden="true"></i>
          <span>Minh hoạ CTDL Đồ thị</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div>SV: Lê Trường Khải</div>
        <div class="tabular-nums">MSSV: 25300003</div>
      </div>
    </aside>

    <!-- Khu vực nội dung chính -->
    <div id="main-wrapper">
      <!-- Thanh đỉnh (Top Bar) -->
      <header id="topbar">
        <div class="topbar-left">
          <!-- Đồng hồ giả lập Flip-Clock 5 ô riêng -->
          <div class="clock-widget">
            <div id="clock-icon-wrapper" class="clock-icon-wrapper" aria-hidden="true">
              <i data-lucide="clock" width="18" height="18" style="width: 18px; height: 18px;"></i>
            </div>
            <div class="clock-display">
              <span class="clock-label">Đồng hồ giả lập</span>
              <span id="clock-time" class="clock-time tabular-nums" aria-live="polite" aria-label="Đang nạp đồng hồ giả lập">--/--/---- --:00</span>
            </div>
          </div>

          <!-- Nhóm nút tua thời gian -->
          <div class="clock-actions">
            <button id="btn-advance-1h" type="button" class="btn btn-secondary btn-sm" title="Tua thời gian thêm 1 giờ" aria-label="Tua thời gian thêm 1 giờ">
              <i data-lucide="fast-forward" width="14" height="14" style="width: 14px; height: 14px;" aria-hidden="true"></i>
              <span>+1h</span>
            </button>
            <button id="btn-advance-24h" type="button" class="btn btn-secondary btn-sm" title="Tua thời gian thêm 24 giờ (1 ngày)" aria-label="Tua thời gian thêm 24 giờ">
              <i data-lucide="fast-forward" width="14" height="14" style="width: 14px; height: 14px;" aria-hidden="true"></i>
              <span>+24h</span>
            </button>
            <button id="btn-advance-nh" type="button" class="btn btn-outline btn-sm" title="Nhập số giờ tuỳ chọn" aria-label="Tua thời gian tuỳ chọn N giờ">
              <span>+Nh…</span>
            </button>
          </div>
        </div>

        <div class="topbar-right">
          <!-- Công tắc toàn cục Bật / Tắt Hiệu ứng 3D -->
          <button
            id="btn-fx-toggle"
            type="button"
            class="fx-toggle-btn is-active"
            role="switch"
            aria-checked="true"
            aria-label="Hiệu ứng 3D"
            title="Hiệu ứng 3D đang BẬT — Nhấp để tắt về giao diện phẳng"
          >
            <span class="fx-toggle-icon" aria-hidden="true">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3z"></path>
                <path d="M12 12l8-4.5"></path>
                <path d="M12 12v9"></path>
                <path d="M12 12L4 7.5"></path>
              </svg>
            </span>
            <span class="fx-toggle-label">Hiệu ứng 3D</span>
            <span class="fx-toggle-track" aria-hidden="true">
              <span class="fx-toggle-thumb"></span>
            </span>
          </button>

          <!-- Nút chuyển đổi Theme Sáng / Tối -->
          <button id="btn-theme-toggle" type="button" class="btn-icon" title="Chuyển đổi giao diện Sáng / Tối" aria-label="Chuyển đổi giao diện Sáng / Tối">
            <i data-lucide="moon" width="18" height="18" style="width: 18px; height: 18px;" aria-hidden="true"></i>
          </button>
        </div>
      </header>

      <!-- Vùng hiển thị nội dung từng màn hình -->
      <main id="page-container" role="main"></main>
    </div>
  </div>

  <!-- Vùng chứa Toast Notification -->
  <div id="toast-container" aria-live="polite"></div>

  <!-- Vùng chứa Hộp thoại Modal -->
  <div id="modal-backdrop">
    <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-header">
        <h3 class="modal-title" id="modal-title">Tiêu đề</h3>
        <button class="btn-icon" type="button" id="modal-btn-close" aria-label="Đóng">&times;</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-footer" id="modal-footer"></div>
    </div>
  </div>

  <!-- Vùng chứa Panel trượt bên phải (Slide-over Drawer) -->
  <div id="side-panel-backdrop"></div>
  <aside id="side-panel" role="dialog" aria-modal="true" aria-hidden="true" aria-label="Chi tiết thiết bị"></aside>

  <!-- Mã nguồn SPA chính (ES Modules) -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
