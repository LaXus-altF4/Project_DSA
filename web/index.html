<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>LabApp — kiểm tra server</title>
<!-- Trang tạm (giai đoạn 6) chỉ để kiểm tra server chạy. Giao diện thật do giai đoạn 7 thay thế toàn bộ. -->
<style>
  body { font-family: system-ui, "Segoe UI", sans-serif; margin: 24px; color: #222; }
  button { margin-right: 6px; }
  table { border-collapse: collapse; margin-top: 12px; }
  th, td { border: 1px solid #ccc; padding: 4px 8px; text-align: left; }
  .available { color: #1a7f37; } .borrowed { color: #b26b00; } .maintenance { color: #c62828; }
  #log { margin-top: 12px; padding: 8px; background: #f5f5f5; min-height: 2em; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>LabApp — server đang chạy</h1>
<p>Đồng hồ giả lập: <strong id="clock">…</strong>
  <button data-hours="1">+1 giờ</button><button data-hours="24">+24 giờ</button></p>
<div id="log">Thông báo sẽ hiện ở đây.</div>
<table>
  <thead><tr><th>Mã</th><th>Tên</th><th>Trạng thái</th><th>Sẵn/Mượn/Giữ/Bảo trì</th><th>Hàng đợi</th></tr></thead>
  <tbody id="devices"></tbody>
</table>
<script>
const STATUS = { available: 'Sẵn sàng', borrowed: 'Đang mượn', maintenance: 'Bảo trì' };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

async function api(path, options) {
  const res = await fetch('/api' + path, options);
  const body = await res.json();
  if (!res.ok) throw new Error(body.error ? body.error.message : res.statusText);
  return body;
}

async function refresh() {
  const clock = await api('/clock');
  document.getElementById('clock').textContent = clock.text;
  const { devices } = await api('/devices');
  document.getElementById('devices').innerHTML = devices.map(d =>
    `<tr><td>${esc(d.id)}</td><td>${esc(d.name)}</td><td class="${d.status}">${STATUS[d.status]}</td>` +
    `<td>${d.available}/${d.borrowed}/${d.onHold}/${d.maintenance}</td><td>${d.queueLength}</td></tr>`).join('');
  const { notifications } = await api('/notifications');
  if (notifications.length) document.getElementById('log').textContent = notifications.map(n => n.message).join('\n');
}

document.querySelectorAll('button[data-hours]').forEach(b => b.addEventListener('click', async () => {
  try {
    await api('/clock/advance', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                  body: JSON.stringify({ hours: Number(b.dataset.hours) }) });
    await refresh();
  } catch (e) { document.getElementById('log').textContent = 'Lỗi: ' + e.message; }
}));

refresh().catch(e => { document.getElementById('log').textContent = 'Lỗi: ' + e.message; });
</script>
</body>
</html>
